<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مركز إحسان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --n: #2c345c;
      --g: #cfad64;
      --p: #fffefa;
      --bg: #f7f5ef;
      --ink: #293155;
      --muted: #626878;
      --line: #e5e3db;
      --soft: #f1eee5;
      --red: #a02b32;
      --ok: #2d7657;
      --control: #8a8e9d
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.8 'Noto Sans Arabic', Tahoma, sans-serif
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--p);
      padding: 8px 15px
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--n);
      outline-offset: 3px
    }

    .primary {
      background: var(--n);
      border-color: var(--n);
      color: #fff
    }

    .danger {
      color: var(--red)
    }

    .muted {
      font-size: 13px;
      color: var(--muted)
    }

    .error {
      font-size: 13px;
      color: var(--red)
    }

    .success {
      font-size: 13px;
      color: var(--ok)
    }

    .hidden {
      display: none !important
    }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px
    }

    .login-box,
    .panel {
      background: var(--p);
      border: 1px solid var(--line);
      border-radius: 14px
    }

    .login-box {
      width: min(420px, 100%);
      padding: 30px
    }

    .brand {
      font-size: 27px;
      font-weight: 700;
      color: var(--n)
    }

    .gold {
      height: 3px;
      background: var(--g);
      border-radius: 4px;
      margin: 10px 0 25px
    }

    .field {
      display: grid;
      gap: 4px;
      margin: 12px 0
    }

    .field>label,
    .field>span:first-child {
      font-size: 13px
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px
    }

    .field textarea {
      min-height: 80px
    }

    .login-box button {
      width: 100%;
      margin-top: 10px
    }

    .app {
      min-height: 100vh
    }

    .top {
      background: var(--n);
      color: #fff;
      border-bottom: 3px solid var(--g);
      padding: 16px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px
    }

    .top .sub {
      color: #ead59f;
      font-size: 12px
    }

    .user {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px
    }

    .user button {
      background: transparent;
      color: #fff;
      border-color: #777c9c;
      padding: 4px 10px
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 82px)
    }

    .side {
      background: var(--p);
      border-inline-end: 1px solid var(--line);
      padding: 15px
    }

    .side button {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      text-align: start;
      color: var(--muted);
      margin: 3px 0
    }

    .side button.active {
      background: var(--soft);
      color: var(--ink);
      font-weight: 600
    }

    .main {
      max-width: 1380px;
      width: 100%;
      padding: 26px;
      margin-inline: auto;
      margin-block: 0;
      align-self: start
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px
    }

    .head h1,
    .head h2,
    .head h3 {
      margin: 0
    }

    .head h1 {
      font-size: 23px
    }

    .actions,
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .toolbar {
      margin: 18px 0
    }

    .toolbar input,
    .toolbar select {
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: var(--p);
      border-radius: 7px;
      min-width: 145px
    }

    .panel {
      padding: 19px;
      margin-top: 16px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .table {
      overflow: auto;
      margin-top: 14px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: start;
      white-space: nowrap
    }

    th,
    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line)
    }

    th {
      background: var(--soft);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500
    }

    .link {
      padding: 0;
      background: transparent;
      border: 0;
      color: var(--n);
      text-decoration: underline
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px
    }

    .badge {
      background: var(--soft);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px
    }

    .type {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 120px 68px;
      gap: 8px;
      align-items: end;
      margin: 9px 0
    }

    .type input {
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--p)
    }

    .score {
      font-size: 31px;
      font-weight: 600
    }

    .bar {
      height: 5px;
      width: 130px;
      background: var(--soft);
      border-radius: 5px;
      overflow: hidden
    }

    .bar span {
      display: block;
      height: 100%;
      background: var(--g)
    }

    .notice {
      background: var(--soft);
      padding: 10px 13px;
      border-radius: 7px;
      font-size: 13px;
      margin: 12px 0
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: #20264044;
      display: grid;
      place-items: center;
      padding: 18px;
      z-index: 5
    }

    .dialog {
      background: var(--p);
      width: min(520px, 100%);
      max-height: 90vh;
      overflow: auto;
      border-radius: 14px;
      padding: 22px;
      border: 1px solid var(--line)
    }

    @media(max-width:850px) {
      .layout {
        grid-template-columns: 1fr
      }

      .side {
        display: flex;
        overflow: auto;
        border-inline-end: 0;
        border-bottom: 1px solid var(--line);
        padding: 8px
      }

      .side button {
        width: auto;
        white-space: nowrap
      }

      .main {
        padding: 17px
      }
    }

    @media(max-width:560px) {

      .grid,
      .grid.two {
        grid-template-columns: 1fr
      }

      .main {
        padding: 12px
      }

      .optional {
        display: none
      }

      .top {
        padding: 13px 15px
      }

      .type {
        grid-template-columns: 1fr 75px 55px
      }
    }

    @media print {

      .top,
      .side,
      .toolbar,
      .actions,
      .no-print {
        display: none !important
      }

      .layout {
        display: block
      }

      .main {
        padding: 0
      }

      .panel {
        border: 0
      }
    }

    .main {
      min-width: 0
    }

    .panel {
      overflow-x: auto
    }

    .dialog table {
      font-size: 13px
    }

    .user {
      flex-wrap: wrap
    }

    .user select {
      max-width: 220px;
      background: #fffefa;
      color: #293155;
      border: 0;
      border-radius: 6px;
      padding: 5px
    }

    .toolbar label {
      display: grid;
      gap: 3px;
      font-size: 13px
    }

    .dialog .error {
      white-space: normal
    }

    input {
      caret-color: var(--n)
    }

    ::selection {
      background: #e7d5a9;
      color: #293155
    }

    @media(pointer:coarse) {

      button,
      input,
      select {
        min-height: 44px
      }
    }

    @media(max-width:560px) {
      .top {
        align-items: flex-start;
        flex-direction: column
      }

      .user select {
        max-width: 180px
      }
    }

    /* Keep extreme content inside its own surface, including at 200% zoom. */
    .layout {
      grid-template-columns: 220px minmax(0, 1fr)
    }

    .head>*,
    .grid>*,
    .type>*,
    .toolbar>*,
    .user>* {
      min-width: 0
    }

    .head h1,
    .head h2,
    .head h3,
    .notice,
    .global-message,
    .error,
    #userName {
      overflow-wrap: anywhere
    }

    .toolbar input,
    .toolbar select,
    .field input,
    .field select {
      max-width: 100%
    }

    .user select {
      min-width: 0;
      width: min(220px, 100%)
    }

    .panel table,
    .dialog table {
      table-layout: auto
    }

    td {
      white-space: normal;
      overflow-wrap: anywhere;
      max-width: 32ch;
      min-width: 6ch
    }

    button {
      overflow-wrap: anywhere
    }

    .side button {
      overflow-wrap: normal
    }

    .dialog {
      min-width: 0;
      max-height: 90dvh;
      overscroll-behavior: contain
    }

    .modal-open {
      overflow: hidden
    }

    .request-status {
      position: fixed;
      inset-block-end: 12px;
      inset-inline: 12px;
      margin: 0 auto;
      width: fit-content;
      max-width: calc(100% - 24px);
      padding: 8px 14px;
      background: var(--n);
      color: #fff;
      border-radius: 8px;
      z-index: 6
    }

    .request-status:empty {
      display: none
    }

    @media(max-width:850px) {
      .layout {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    @media(max-width:560px) {

      body,
      input,
      select,
      textarea {
        font-size: 16px
      }

      .toolbar>label {
        flex: 1 1 145px
      }

      .toolbar input,
      .toolbar select {
        min-width: 0;
        width: 100%
      }

      .dialog {
        padding: 16px
      }

      .type {
        grid-template-columns: minmax(0, 1fr) minmax(70px, .5fr)
      }

      .type>button {
        grid-column: 1/-1;
        justify-self: start
      }
    }

    /* Shared finishing details for forms, navigation, and tabular work. */
    :root {
      scrollbar-color: var(--control) var(--soft)
    }

    input,
    select,
    textarea {
      accent-color: var(--n);
      caret-color: var(--n)
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted);
      opacity: 1
    }

    .field input,
    .field select,
    .field textarea,
    .toolbar input,
    .toolbar select,
    .type input {
      border-color: var(--control)
    }

    .field input:disabled,
    .field select:disabled,
    .field textarea:disabled {
      background: var(--soft);
      color: var(--muted);
      opacity: 1
    }

    .top :focus-visible {
      outline-color: var(--g)
    }

    a,
    .link {
      text-underline-offset: .2em;
      text-decoration-thickness: 1px
    }

    button:not(:disabled):active {
      background: var(--soft)
    }

    button.primary:not(:disabled):active {
      background: var(--ink)
    }

    .side button.active,
    .toolbar button[aria-pressed="true"] {
      background: var(--soft);
      color: var(--ink);
      font-weight: 600
    }

    .head>div>p {
      margin: 4px 0 0
    }

    .dialog>.head {
      padding-block-end: 16px;
      border-bottom: 1px solid var(--line);
      margin-block-end: 16px
    }

    .dialog h2,
    .subpanel h2 {
      font-size: 20px;
      line-height: 1.6
    }

    .dialog h3 {
      margin-block: 24px 8px
    }

    .dialog .grid {
      margin-block: 12px 16px;
      align-items: start
    }

    .grid>.field,
    .type>.field {
      margin: 0
    }

    .type {
      align-items: end;
      margin-block: 16px
    }

    .error:empty,
    .global-message:empty {
      display: none
    }

    .dialog form>.primary {
      margin-block-start: 16px
    }

    .dialog .actions {
      margin-block-start: 20px
    }

    .subpanel>.head {
      margin-block: 8px 16px
    }

    .subpanel table {
      margin-block-end: 16px
    }

    td {
      vertical-align: middle;
      font-variant-numeric: tabular-nums
    }

    td>button+button {
      margin-inline-start: 6px
    }

    .empty {
      white-space: normal
    }

    @media(hover:hover) {
      button:not(:disabled):hover {
        background: var(--soft);
        border-color: var(--control)
      }

      button.primary:not(:disabled):hover {
        background: var(--ink);
        border-color: var(--ink)
      }

      .user button:not(:disabled):hover {
        background: #ffffff1a;
        border-color: var(--g)
      }

      .link:not(:disabled):hover {
        background: transparent;
        text-decoration-thickness: 2px
      }

      tbody tr:has(button):hover {
        background: var(--bg)
      }
    }

    @media(max-width:850px) {
      .side {
        gap: 4px
      }

      .side button {
        flex-shrink: 0
      }
    }

    @media(forced-colors:active) {

      .side button.active,
      .toolbar button[aria-pressed="true"] {
        outline: 2px solid Highlight;
        outline-offset: -2px
      }
    }

    @media print {
      .layout {
        display: block
      }

      .request-status {
        display: none
      }

      .panel {
        overflow: visible
      }

      td {
        max-width: none
      }
    }
  </style>
</head>

<body>
  <section id="login" class="login">
    <form id="loginForm" class="login-box">
      <div class="brand">مركز إحسان</div>
      <div class="muted">لوحة المشرفين · الجابرية</div>
      <div class="gold"></div><label class="field">اسم المستخدم<input id="username" autocomplete="username"
          required></label><label class="field">كلمة المرور<input id="password" type="password"
          autocomplete="current-password" required></label><button class="primary" type="submit">دخول</button>
      <p id="loginMsg" class="error" role="alert"></p>
    </form>
  </section>
  <section id="app" class="app hidden">
    <header class="top">
      <div>
        <div class="brand" style="color:#fff">مركز إحسان</div>
        <div class="sub">لوحة المشرفين · الجابرية، الكويت</div>
      </div>
      <div class="user"><span id="userName"></span><select id="seasonSelect" aria-label="الموسم"></select><button
          id="refresh">تحديث</button><button id="logout">خروج</button></div>
    </header>
    <div class="layout">
      <aside class="side"><button data-view="students" class="active">الطلاب</button><button
          data-view="attendance">الحضور</button><button data-view="reports">التقارير</button><button
          data-view="settings">الإعدادات</button></aside>
      <main id="main" class="main"></main>
    </div>
  </section>
  <p id="requestStatus" class="request-status" role="status" aria-live="polite"></p>
  <script>
    (() => {

      const disabledBefore = new WeakMap();
      function setBusy(on) {
        if (S.busy === on) return;
        S.busy = on;
        $('#app').setAttribute('aria-busy', String(on));
        $('#loginForm').setAttribute('aria-busy', String(on));
        $('#requestStatus').textContent = on ? 'جارٍ تنفيذ الطلب…' : '';
        $$('button,input,select,textarea').forEach(el => {
          if (on) { disabledBefore.set(el, el.disabled); el.disabled = true; }
          else if (disabledBefore.has(el)) { el.disabled = disabledBefore.get(el); disabledBefore.delete(el); }
        });
      }
      let editorOpener = null;
      function closeEditors() {
        $$('.overlay').forEach(el => el.remove()); S.dirty = false;
        $('#app').inert = false; $('#login').inert = false; document.body.classList.remove('modal-open');
        const opener = editorOpener; editorOpener = null; if (opener?.isConnected !== false) opener?.focus();
      }
      function localLogout(message) {
        storage.set(''); S.token = ''; S.user = null; S.data = null; closeEditors();
        $('#password').value = ''; $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
        $('#loginMsg').textContent = message || '';
      }
      function msg(text, ok = false) {
        const target = $('.dialog') || $('#main'); let p = target.querySelector('.global-message');

          if (ownCredentials) { localLogout('تم تحديث حسابك. سجّل الدخول ببياناتك الجديدة.'); return; }
          if (action === 'saveSeason' && !payload.id) S.seasonId = result.seasons.at(-1)?.id;
          if (!S.seasonId || !result.seasons.some(x => x.id === S.seasonId)) S.seasonId = season()?.id;
          render(); if (message) msg(message, true);
        });
      }
      function guard() { return !S.dirty || confirm('لديك تغييرات غير محفوظة. هل تريد المتابعة دون حفظ؟'); }
      function eligible(student, day, groupId) {
        if (Array.isArray(student.enrollments)) return student.enrollments.some(e => e.groupId === groupId && e.from <= day && (!e.to || day <= e.to));
        return student.active && student.groupId === groupId && student.joinedOn <= day;
      }
      function time(value) { return value ? new Date(value).toLocaleString('ar-KW', { timeZone: 'Asia/Kuwait', dateStyle: 'short', timeStyle: 'short' }) : '—'; }

      function score(st, se, ms, typeId) { const bs = (se?.types || []).filter(t => !typeId || t.id === typeId).map(t => { const e = ms.filter(m => m.status === 'approved' && m.typeId === t.id && m.roster?.includes(st.id) && m.date <= today()), p = e.filter(m => m.attendance?.[st.id] === 'present').length; return { t, e, p } }).filter(x => x.e.length); if (!bs.length) return '—'; const w = bs.reduce((n, x) => n + x.t.weight, 0); return ar(bs.reduce((n, x) => n + x.p / x.e.length * x.t.weight, 0) / w * 100) }

        call('login', { username: u, password: p }, r => {
          S.token = r.token; storage.set(S.token); S.user = r.user; S.data = r.data;
          S.seasonId = season()?.id; $('#password').value = '';
          $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); render();

      }; $('#logout').onclick = () => { if (guard()) call('logout', {}, () => localLogout('')) }; $('#seasonSelect').onchange = () => { if (!guard()) { render(); return } const selected = $('#seasonSelect').value; closeEditors(); S.seasonId = selected; render() }; $$('[data-view]').forEach(b => b.onclick = () => { if (!guard()) return; closeEditors(); S.view = b.dataset.view; S.dirty = false; render() }); window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = '' } }); if (S.token) call('bootstrap', {}, r => { S.user = r.user; S.data = r; S.seasonId = season()?.id; $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); render() }, text => $('#loginMsg').textContent = text);
